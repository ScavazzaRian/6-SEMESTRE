spring.application.name=chefsystem

spring.datasource.url=${DB_URL:jdbc:h2:mem:chefsystem;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:chefsystem}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:chefsystem-local}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Swagger UI e especificação OpenAPI.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
